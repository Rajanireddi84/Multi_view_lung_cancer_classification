[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claws-net"
version = "1.0.0"
description = "CLAWS-Net: Contrastive Learning-Augmented Multi-View Transformer Network for lung nodule classification and subtype prediction"
requires-python = ">=3.9"

[tool.setuptools]
packages = ["claws_net"]
